name: Public distribution data
on:
  schedule:
    - cron: '0 2 * * 1,6'
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Distribution task
        type: choice
        options: [weekly, backfill]
        default: weekly
permissions:
  contents: write
concurrency:
  group: public-distribution-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && vars.PUBLIC_DATA_ENABLED == 'true' && (github.event.schedule != '17 * * * *' || (vars.HISTORY_APPROVED == 'true' && vars.BACKFILL_QUEUE_URL != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh or backfill one bounded round
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          HISTORY_APPROVED: ${{ vars.HISTORY_APPROVED }}
          BACKFILL_QUEUE_URL: ${{ vars.BACKFILL_QUEUE_URL }}
          BACKFILL_JOB_TOKEN: ${{ secrets.BACKFILL_JOB_TOKEN }}
        run: |
          if [ "$MODE" = backfill ]; then
            if [ "$HISTORY_APPROVED" != true ] || [ -z "$BACKFILL_QUEUE_URL" ]; then
              echo 'Backfill is not enabled'
              exit 1
            fi
            node scripts/backfill.mjs --fetch
          elif [ "$SCHEDULE" != '17 * * * *' ]; then
            node scripts/update.mjs --fetch
          elif [ "$(node -p 'Boolean(require("./.state/checkpoint.json").activeCycle)')" = true ]; then
            node scripts/update.mjs --fetch --resume
          elif [ "$HISTORY_APPROVED" = true ] && [ -n "$BACKFILL_QUEUE_URL" ]; then
            node scripts/backfill.mjs --fetch
          fi
      - name: Validate public assets
        run: node scripts/verify.mjs
      - name: Determine publication
        id: publication
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const manifest=JSON.parse(fs.readFileSync('assets/manifest.json'));
          let previous={};try{previous=JSON.parse(fs.readFileSync('.state/published.json'))}catch{}
          const catalog=fs.existsSync('assets/distribution-catalog.json')?createHash('sha256').update(fs.readFileSync('assets/distribution-catalog.json')).digest('hex'):null;
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'needed='+(manifest.version!==previous.version||catalog!==(previous.catalog??null))+'\n');
          JS
      - name: Publish static assets only
        if: steps.publication.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token=(process.env.CLOUDFLARE_API_TOKEN??'').trim(),account=(process.env.CLOUDFLARE_ACCOUNT_ID??'').trim();
          const tokenFormat=/^[A-Za-z0-9_-]{40,256}$/.test(token),accountFormat=/^[a-f0-9]{32}$/.test(account);
          console.log(JSON.stringify({tokenFormat,accountFormat,trimRequired:token!==process.env.CLOUDFLARE_API_TOKEN}));
          if(!tokenFormat||!accountFormat)throw Error('Deployment secret format invalid; review encrypted configuration without exposing values');
          JS
          npx --yes wrangler@4.148.0 deploy --config wrangler.jsonc
      - name: Verify published bytes
        if: steps.publication.outputs.needed == 'true'
        env:
          PUBLIC_DATA_URL: ${{ vars.PUBLIC_DATA_URL }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';import{createHash}from'node:crypto';
          const base=process.env.PUBLIC_DATA_URL;if(!base?.startsWith('https://'))throw Error('PUBLIC_DATA_URL required');
          const manifest=JSON.parse(await fs.readFile('assets/manifest.json','utf8'));
          const files=['manifest.json',...manifest.items.map(i=>'v1/distribution/'+i.symbol+'/'+i.version+'.json')];
          const catalog=await fs.readFile('assets/distribution-catalog.json').catch(e=>{if(e.code!=='ENOENT')throw e;return null;});
          if(catalog)files.push('distribution-catalog.json');
          for(const file of files){
            const url=new URL(file,base.replace(/\/$/,'')+'/');
            const local=await fs.readFile('assets/'+file);
            if(!file.startsWith('v1/'))url.searchParams.set('release',createHash('sha256').update(local).digest('hex'));
            let matches=false;
            for(let attempt=0;attempt<4&&!matches;attempt++){
              if(attempt)await new Promise(resolve=>setTimeout(resolve,5000*attempt));
              const remote=await fetch(url,{cache:'no-cache',signal:AbortSignal.timeout(15000)})
                .then(async r=>r.ok?Buffer.from(await r.arrayBuffer()):null).catch(()=>null);
              matches=remote?.equals(local)??false;
            }
            if(!matches)throw Error('Published bytes unavailable or mismatched: '+file);
          }
          await fs.writeFile('.state/published.json',JSON.stringify({version:manifest.version,catalog:catalog?createHash('sha256').update(catalog).digest('hex'):null,at:new Date().toISOString()}));
          JS
      - name: Preserve public progress and accepted data
        if: always()
        run: |
          git config user.name 'clec-public-data bot'
          git config user.email 'clec-public-data@users.noreply.github.com'
          git add .state assets
          if ! git diff --cached --quiet; then
            git commit -m 'Update public distribution data and progress'
            git push
          fi
      - name: Acknowledge completed work after readback and checkpoint
        if: success() && vars.HISTORY_APPROVED == 'true' && vars.BACKFILL_QUEUE_URL != ''
        env:
          BACKFILL_QUEUE_URL: ${{ vars.BACKFILL_QUEUE_URL }}
          BACKFILL_JOB_TOKEN: ${{ secrets.BACKFILL_JOB_TOKEN }}
        run: node scripts/backfill.mjs --ack
