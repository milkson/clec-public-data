name: Public distribution data
on:
  schedule:
    - cron: '0 2 * * 1,6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-distribution-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main' && vars.PUBLIC_DATA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update recent four periods
        run: node scripts/update.mjs --fetch
      - name: Validate public assets
        run: node scripts/verify.mjs
      - name: Determine publication
        id: publication
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('assets/manifest.json'));
          let previous='';try{previous=JSON.parse(fs.readFileSync('.state/published.json')).version}catch{}
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'needed='+(manifest.version!==previous)+'\n');
          JS
      - name: Publish static assets only
        if: steps.publication.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'JS'
          const token=(process.env.CLOUDFLARE_API_TOKEN??'').trim(),account=(process.env.CLOUDFLARE_ACCOUNT_ID??'').trim();
          const tokenFormat=/^[A-Za-z0-9_-]{40,256}$/.test(token),accountFormat=/^[a-f0-9]{32}$/.test(account);
          console.log(JSON.stringify({tokenFormat,accountFormat,trimRequired:token!==process.env.CLOUDFLARE_API_TOKEN}));
          if(!tokenFormat||!accountFormat)throw Error('Deployment secret format invalid; review encrypted configuration without exposing values');
          JS
          npx --yes wrangler@4.148.0 deploy --config wrangler.jsonc
      - name: Verify published bytes
        if: steps.publication.outputs.needed == 'true'
        env:
          PUBLIC_DATA_URL: ${{ vars.PUBLIC_DATA_URL }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';import{createHash}from'node:crypto';
          const base=process.env.PUBLIC_DATA_URL;if(!base?.startsWith('https://'))throw Error('PUBLIC_DATA_URL required');
          const manifest=JSON.parse(await fs.readFile('assets/manifest.json','utf8'));
          const files=['manifest.json',...manifest.items.map(i=>'v1/distribution/'+i.symbol+'/'+i.version+'.json')];
          for(const file of files){const r=await fetch(base.replace(/\/$/,'')+'/'+file,{cache:'no-cache'});if(!r.ok)throw Error('Published resource unavailable');const remote=Buffer.from(await r.arrayBuffer()),local=await fs.readFile('assets/'+file);if(!remote.equals(local))throw Error('Published bytes mismatch');}
          await fs.writeFile('.state/published.json',JSON.stringify({version:manifest.version,at:new Date().toISOString()}));
          JS
      - name: Preserve public progress and accepted data
        if: always()
        run: |
          git config user.name 'clec-public-data bot'
          git config user.email 'clec-public-data@users.noreply.github.com'
          git add .state assets
          if ! git diff --cached --quiet; then
            git commit -m 'Update public distribution data and progress'
            git push
          fi
